<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>今日星座寄语 · 时光里的星与心</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #2b215c 0%, #4a3a9e 55%, #6b57c9 100%);
    color: #fff; min-height: 100vh;
    display: flex; justify-content: center; align-items: flex-start;
  }
  #app { width: 100%; max-width: 480px; padding: 24px 18px 40px; }
  .stars { font-size: 26px; text-align: center; margin-bottom: 6px; letter-spacing: 6px; }
  h1 { font-size: 22px; font-weight: 600; text-align: center; line-height: 1.4; margin-bottom: 6px; }
  .date { text-align: center; font-size: 14px; opacity: .85; margin-bottom: 4px; }
  .sub { text-align: center; font-size: 13px; opacity: .72; margin-bottom: 22px; line-height: 1.6; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .sign {
    padding: 14px 6px; border-radius: 14px; text-align: center; cursor: pointer;
    background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.16);
    transition: all .15s;
  }
  .sign:active, .sign.on { background: rgba(255,216,107,.22); border-color: #ffd86b; }
  .sign .e { font-size: 22px; }
  .sign .n { font-size: 15px; font-weight: 500; margin-top: 2px; }

  .card {
    margin-top: 22px; background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.16); border-radius: 16px;
    padding: 18px 16px; display: none;
  }
  .card.show { display: block; animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none;} }
  .c-head { text-align:center; margin-bottom: 14px; }
  .c-head .ce { font-size: 30px; }
  .c-head .cn { font-size: 20px; font-weight: 600; }
  .c-head .cd { font-size: 12px; opacity:.7; margin-top:2px; }
  .blk { margin-bottom: 14px; }
  .blk .t { font-size: 13px; color:#ffd86b; font-weight:600; margin-bottom:5px; }
  .blk .v { font-size: 15px; line-height: 1.8; opacity: .95; }
  .lucky { font-size: 14px; text-align:center; padding: 10px; border-radius: 12px;
    background: rgba(255,216,107,.14); color:#ffd86b; margin-bottom: 14px; }
  .btn {
    display: block; width: 100%; padding: 13px; border: none; border-radius: 14px;
    background: #ffd86b; color: #3a2a06; font-size: 15px; font-weight: 600;
    cursor: pointer; margin-top: 6px; transition: transform .15s;
  }
  .btn:active { transform: scale(.97); }
  .btn.ghost { background: rgba(255,255,255,.14); color: #fff; }
  .foot { text-align:center; font-size:12px; opacity:.6; margin-top:24px; line-height:1.7; }
</style>
</head>
<body>
<div id="app">
  <div class="stars">✦ ✧ ✦</div>
  <h1>今日星座寄语</h1>
  <div class="date" id="dateLabel"></div>
  <p class="sub">选你的星座，看看今天的能量走向。<br>每日自动焕新，愿你被星光照亮。</p>

  <div class="grid" id="grid"></div>

  <div class="card" id="card">
    <div class="c-head">
      <div class="ce" id="ce"></div>
      <div class="cn" id="cn"></div>
      <div class="cd" id="cd"></div>
    </div>
    <div class="blk"><div class="t">✨ 整体运</div><div class="v" id="v-overall"></div></div>
    <div class="blk"><div class="t">💼 事业运</div><div class="v" id="v-career"></div></div>
    <div class="blk"><div class="t">💗 感情运</div><div class="v" id="v-love"></div></div>
    <div class="blk"><div class="t">🌿 今日小贴士</div><div class="v" id="v-tip"></div></div>
    <div class="lucky" id="lucky"></div>
    <button class="btn" onclick="copyToday()">复制我的今日寄语 📋</button>
    <button class="btn ghost" onclick="document.getElementById('card').classList.remove('show')">收起</button>
  </div>

  <p class="foot">关注【时光里的星与心】· 回复你的星座名看每日寄语<br>本页寄语仅为趣味心灵内容，愿你今天被温柔以待。</p>
</div>

  love:{h:["别用挑剔表达爱，","对方要的是被接纳，","单身的处女今天，","把「我帮你」换成「我们一起」，","想靠近的人，","藏在要求里的在乎，"]},
  tips:{h:["今天大扫除一个角落，","列三件必做做完奖励自己，","别反复检查同一条消息，","深呼吸五次，","给完美主义放个假，","想说没说的话，"]}},
 {n:"天秤", e:"♎",
  overall:{h:["今天你天然知道怎么让人舒服，","天秤的审美，","别在两端反复横跳，","一次温和的协调，","你平衡的天赋，","恰到好处的分寸，"]},
  career:{h:["两边都不得罪的事，","合作项目里你是指针，","别为和谐吞下不合理，","presentation今天你，","需要斡旋的场合，","今天你的周到，"]},
  love:{h:["平等对话比套路更打动TA，","别在关系里算太精，","单身的天秤今天，","有分歧就摊开说，","想靠近的人，","藏在客气里的真心，"]},
  tips:{h:["今天整理下社交留白，","挑一件喜欢的事认真享受，","别替别人做决定，","听首完整的歌，","给房间换个摆设，","想说没说的话，"]}},
 {n:"天蝎", e:"♏",
  overall:{h:["今天你的洞察力像刀，","天蝎的专注，","别把猜疑当情报，","一段深聊，","你藏着的锋芒，","看透人事的清醒，"]},
  career:{h:["复杂局里你最清醒，","别把所有牌亮完，","对手的破绽，","长期布局的事，","需要魄力的决策，","今天你的谋略，"]},
  love:{h:["别用试探代替信任，","你的占有欲要化成陪伴，","单身的天蝎今天，","一句坦诚比十句试探管用，","想靠近的人，","藏在冷面里的炽热，"]},
  tips:{h:["今天独处一小时，","别翻旧账，","运动到出汗，","写封不寄出的信，","对值得的人给足信任，","想说没说的话，"]}},
 {n:"射手", e:"♐",
  overall:{h:["今天你的脚步想往远处去，","射手的乐观，","别被条条框框困住，","一个说走就走的念头，","你向往自由的魂，","开阔的心境，"]},
  career:{h:["需要创意和野心的活，","别在细枝末节磨，","远方的机会，","你的热情能拉来贵人，","需要破局的时刻，","今天你的冲劲，"]},
  love:{h:["别用自由当逃避亲密的借口，","带TA去看点不一样的，","单身的射手今天，","诚实说想独处比冷处理体面，","想靠近的人，","藏在洒脱里的认真，"]},
  tips:{h:["今天去个没去过的地方，","学一句外语或冷知识，","别答应束缚自己的约，","大笑一场，","给远方的人发个问候，","想说没说的话，"]}},
 {n:"摩羯", e:"♑",
  overall:{h:["今天你的稳，","摩羯的坚持，","别急着要反馈，","把大目标拆小，","你扛住的压力，","沉默里的定力，"]},
  career:{h:["踏实的人今天被委以重任，","别抢风头功劳自己会说话，","卡久的项目，","你的靠谱是团队的安全感，","需要扛事的环节，","今天你的担当，"]},
  love:{h:["别用忙当回避感情的挡箭牌，","稳定陪伴比惊天动地动人，","单身的摩羯今天，","把「我在忙」换成「我想你」，","想靠近的人，","藏在沉默里的温柔，"]},
  tips:{h:["今天列周计划，","给自己设个下班线，","夸夸努力的自己，","存一笔小钱，","爬段楼梯，","想说没说的话，"]}},
 {n:"水瓶", e:"♒",
  overall:{h:["今天你的脑洞和别人不在一个频道，","水瓶的独特，","别为了合群改自己，","一个反常的念头，","你自由的灵魂，","跳脱的思路，"]},

  tips:{h:["今天尝试一件没做过的小事，","关掉算法推荐自己找点料，","和想法不同的人聊五分钟，","给未来写句疯话，","独处充电别愧疚，","想说没说的话，"]}},
 {n:"双鱼", e:"♓",

  career:{h:["需要创意和温度的事，","别答应超出心力的活，","你的细腻补上了缝隙，","灵感来了马上记，","需要共情的场合，","今天你的灵气，"]},

];
var COLORS = ["蜜橘色","雾蓝","暖白","墨绿","焦糖棕","浅紫","宝蓝","米金"];
var DIRS = ["正东","东南","正南","西南","正西","西北","正北","东北"];

function chinaDate(){
  var f = new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',weekday:'long'});
  var p = f.formatToParts(new Date()), o={};
  p.forEach(function(x){ o[x.type]=x.value; });
  return { key:o.year+'-'+o.month+'-'+o.day, label:o.year+'年'+o.month+'月'+o.day+'日 '+o.weekday };
}
function seedFrom(str){ var h=2166136261; for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function rngFor(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function pick(arr,r){ return arr[Math.floor(r()*arr.length)]; }

function buildGrid(){
  var g = document.getElementById('grid');
  SIGNS.forEach(function(s, idx){
    var d = document.createElement('div');
    d.className = 'sign';
    d.innerHTML = '<div class="e">'+s.e+'</div><div class="n">'+s.n+'</div>';
    d.onclick = function(){ showSign(idx, d); };
    g.appendChild(d);
  });
  document.getElementById('dateLabel').textContent = chinaDate().label + ' · 每日寄语';
}

var currentText = "";
function showSign(idx, el){
  document.querySelectorAll('.sign').forEach(function(x){ x.classList.remove('on'); });
  el.classList.add('on');
  var d = chinaDate(), s = SIGNS[idx], r = rngFor(seedFrom(d.key + s.n));
  var overall = pick(s.overall.h,r) + pick(TAILS.overall,r);
  var career  = pick(s.career.h,r)  + pick(TAILS.career,r);
  var love    = pick(s.love.h,r)    + pick(TAILS.love,r);
  var tip     = pick(s.tips.h,r)    + pick(TAILS.tips,r);
  var num = 1 + Math.floor(r()*9);
  var color = pick(COLORS,r), dir = pick(DIRS,r);
  document.getElementById('ce').textContent = s.e;
  document.getElementById('cn').textContent = s.n + '座 · 今日寄语';
  document.getElementById('cd').textContent = d.label;
  document.getElementById('v-overall').textContent = overall;
  document.getElementById('v-career').textContent = career;
  document.getElementById('v-love').textContent = love;
  document.getElementById('v-tip').textContent = tip;
  document.getElementById('lucky').textContent = '🍀 幸运数字 '+num+' ｜ 幸运色 '+color+' ｜ 贵人方位 '+dir;
  currentText = '【'+s.n+'座 · 今日寄语】'+d.label+'\n整体：'+overall+'\n事业：'+career+'\n感情：'+love+'\n贴士：'+tip+'\n幸运'+num+'｜'+color+'｜'+dir+'｜ 来自「时光里的星与心」';
  var c = document.getElementById('card'); c.classList.add('show'); c.scrollIntoView({behavior:'smooth', block:'start'});
}

function copyToday(){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(currentText).then(function(){ alert('已复制，去粘贴给朋友吧 ✨'); });
  } else {
    var ta=document.createElement('textarea'); ta.value=currentText; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); alert('已复制 ✨'); }catch(e){ alert('复制失败，请手动长按选择'); } document.body.removeChild(ta);
  }
}

buildGrid();
</script>
</body>
</html>
